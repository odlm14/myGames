<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/toucherCouler.css">
    <title>Toucher-Couler</title>
</head>
<body>
    <div class="container">
        <h1>Toucher-Couler</h1>
        <p class="instructions">Grille de jeu - Essayez de couler tous les navires ennemis!</p>
        
        <div class="game-wrapper">
            <div class="board-section">
                <h2>Grille Ennemie</h2>
                <div class="game-board" id="gameBoard"></div>
            </div>
            
            <div class="info-section">
                <div class="stats">
                    <p>Coups tirés: <span id="shots">0</span></p>
                    <p>Touches: <span id="hits">0</span></p>
                    <p>Coulés: <span id="sunk">0</span></p>
                </div>
                
                <button class="btn-reset" id="resetBtn">Nouveau Jeu</button>
                <a href="index.html" class="btn-back">← Retour</a>
            </div>
        </div>
        
        <div class="message" id="message"></div>
    </div>

    <script src="script/toucherCouler.js"></script>
</body>
</html>
