<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚓ Toucher-Couler</title>
</head>
<body>
    <div style="padding: 40px; text-align: center;">
        <h1>⚓ Mes Jeux</h1>
        <nav style="margin-top: 30px;">
            <ul style="list-style: none; padding: 0;">
                <li style="margin: 20px 0;">
                    <a href="toucherCouler.html" style="
                        display: inline-block;
                        padding: 15px 40px;
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                        color: white;
                        text-decoration: none;
                        border-radius: 8px;
                        font-size: 1.2em;
                        font-weight: bold;
                        transition: all 0.3s ease;
                    " onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 5px 15px rgba(102, 126, 234, 0.4)';" 
                       onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                        🎮 Toucher-Couler Solo
                    </a>
                </li>
                <li style="margin: 20px 0;">
                    <a href="multijoueur.html" style="
                        display: inline-block;
                        padding: 15px 40px;
                        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
                        color: white;
                        text-decoration: none;
                        border-radius: 8px;
                        font-size: 1.2em;
                        font-weight: bold;
                        transition: all 0.3s ease;
                    " onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 5px 15px rgba(245, 87, 108, 0.4)';" 
                       onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                        👥 Toucher-Couler Multijoueur
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
